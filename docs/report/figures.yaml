    value: 0.5
    unit: vcpu
    display: 2
    source: >-
      EKS Fargate cell for the indexer pod - request 500m CPU and 2Gi, plus 256 MB, is 2304Mi,
      which rounds past the 2 GB cell to the 3 GB one at 0.5 vCPU
    group: fargate
  fargate_indexer_gb:
    ref: FR26
    kind: R
    value: 3
    unit: gb
    display: 0
    source: >-
      the memory half of the same cell. The 256 MB addition is what pushes it from 2 GB to 3 GB,
      a 50 percent step that no reading of the manifest alone would predict
    group: fargate
  fargate_chunker_n25:
