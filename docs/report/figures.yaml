      one NAT gateway in each of the three Availability Zones, which is what `single_nat_gateway =
      false` provisions. A NAT gateway is zonal and does not fail over, so a single one makes its
      zone a point of failure for node join, image pulls and every AWS API the runtime uses (ADR-0017)
