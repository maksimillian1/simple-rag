    unit: percent
    display: 1
    source: >-
      the share of node spend at rest that no pod requested - an independent reading on the same
      over-provisioning the right-sized floor removes, measured from the billing side rather than
      from observed working sets
    group: utilisation
    appears_in: [report.md, executions/00-baseline/index.md]

allow:
  - pattern: "24,750"
    file: executions/01-ingestion/index.md
    must_contain: "$1.3823"
    why: the CUR-actuals table prices compute and NAT only, so by its own definition it carries no D23
  - pattern: "41,624"
    file: executions/01-ingestion/index.md
    must_contain: replaced the estimate
    why: a deliberate was-then-now sentence, the superseded figure is the point of it
  - pattern: "41,624"
    file: executions/01-ingestion/index.md
    must_contain: "$2.6122"
    why: the CUR-actuals table's n10 row, which by that table's own definition prices compute and NAT only and carries no D23
  - pattern: "0.2256"
    file: executions/02-inference/data/inference-r050.cost-estimate.json
    must_contain: 00-baseline serving-pool-idle-rate
