  request_overhead_bytes:
    ref: FE15
    kind: E
    value: 3000
    unit: bytes
    display: 0
    source: >-
      What a request carries besides its tokens, added per request rather than per token
      because none of it scales with prompt length. Components - SigV4 Authorization about
      300 B; X-Amz-Security-Token about 1,500 B, which IRSA sends on every call and which
      STS caps at 4,096 B; the remaining request headers about 300 B; response headers
      about 400 B; TCP/IP framing over roughly nine packets both ways about 500 B. NOT
      included - the TLS handshake, several KB per connection, which keep-alive amortises
      by an amount this deployment never measured. Estimated from component sizes, not
      measured - the measurement is EUC1-NatGateway-Bytes over a run that actually calls
      Bedrock, which tech-debt 9 owes and which would replace this figure outright
    group: marginal

