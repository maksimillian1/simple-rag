    group: totals
    appears_in: [executions/00-baseline/index.md]

  block_a_variable:
    formula: core_cross_az_unknown + nat_processing + other_cross_az
    unit: usd_per_month
    group: totals
    appears_in: [executions/00-baseline/index.md]

  block_b_fixed:
    formula: db_nodes + db_root_ebs + qdrant_pvcs + vpc_endpoints + serving_nodes + serving_root_ebs + nlb
    unit: usd_per_month
    group: totals
    appears_in: [executions/00-baseline/index.md]

  block_b_variable:
