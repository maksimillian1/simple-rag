  nlb:
    ref: FD19
    kind: D
    formula: nlb_hour * hours_per_month
    unit: usd_per_month
    source: >-
      Block A, not B, as of 2026-09-26. The NLB belongs to the Gateway in
      deploy/k8s/platform/gateway/resources/gateway.yaml - namespace rag-platform, listener
      allowedRoutes namespaces from All - and routes.yaml already parents two routes on it, / to
      the api and /monitor to monitoring-grafana. Delete the feature and the Gateway, the NLB and
      Grafana's route remain, which is Block B's own criterion applied. The block rests on who owns
      the Gateway and how wide its scope is, not on that second route: Grafana's route is corroboration
      that "from: All" is used in practice, so removing it would not move this line back to B. It also settles the
      "A or B?" line in 00-baseline R5 and agrees with public_ipv4 (FD6), where the same NLB's
      three addresses were already in A
    group: a_fixed

