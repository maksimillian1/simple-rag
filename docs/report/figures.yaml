meta:
  updated: 2026-09-19
  capture_hour: 2026-09-04T18:00Z
  method: CUR inventory from one resting hour x unit rate x 730; EBS as size x $/GB-month; variable lines as rest-hour usage x rate x 730
  cur: s3://simple-rag-cur-reports-883f615c/cur2/simple-rag BILLING_PERIOD=2026-09
  rate_card: executions/00-baseline/data/price-2026-09-09.json
  rule: every currency figure printed in the report exists here; totals are summed from exact values, never from rounded parts
  rounding: AWS itself stores CUR costs unrounded (69% of this month's rows carry 10 decimals) and rounds once at the end; rounding per row and summing would have overstated 2026-09 by $2.06
  display: prose prints whole dollars; tables print cents where the lines have to add up; rates and per-unit figures keep the decimals that separate them
  naming: name a figure after what it is, not after how it was produced. A leaf carries the metric ref when the report has one (m9_gross_r050), otherwise the resource (serving_nodes). A per-point figure ends in the point id (_r050, _n25), a per-day one in the date (_0905). Groups are named by subject, not by date. Two authors without this rule produced serving_gross_r050 and m9_gross_r050 for the same number on 2026-09-21; the m9_ form won because the report cites M9

scan:
  - report.md
  - executions/00-baseline/index.md
  - executions/00-baseline/concepts.md
  - executions/01-ingestion/index.md
  - executions/01-ingestion/metrics.md
  - executions/01-ingestion/concepts.md
  - executions/02-inference/index.md
  - executions/02-inference/concepts.md
  - ../tech-debt.md

