allow:
  - pattern: "24,750"
    file: executions/01-ingestion/index.md
    must_contain: "$1.3823"
    why: the CUR-actuals table prices compute and NAT only, so by its own definition it carries no D23
  - pattern: "41,624"
    file: executions/01-ingestion/index.md
    must_contain: replaced the estimate
    why: a deliberate was-then-now sentence, the superseded figure is the point of it

retired:
  - pattern: "426.93"
    replaced_by: block_b_total
    why: Block B before the Floor was re-based on the resting hour
  - pattern: "708.72"
    replaced_by: c_total
    why: Block C before the re-base
  - pattern: "281.79"
    replaced_by: block_a_total
    why: Block A before the re-base
  - pattern: "0.20892"
    replaced_by: serving_idle_rate
    why: serving idle rate from the bootstrap capture hour
  - pattern: "0.2256"
    replaced_by: serving_idle_rate
    why: first serving idle rate, extrapolated a per-GB charge as an hourly rate
  - pattern: "$598"
    replaced_by: budget_alarm
