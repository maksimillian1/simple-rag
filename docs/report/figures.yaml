    source: >-
      EKS Fargate compute configuration for the chunker pod. Its request is 100m CPU and 512Mi;
      Fargate adds 256 MB for kubelet, kube-proxy and containerd, giving 768Mi, and rounds up to
      the smallest cell that fits - 0.25 vCPU with 1 GB
