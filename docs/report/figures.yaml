    group: utilisation
    appears_in: [executions/00-baseline/index.md]

  node_cost_unrequested:
    ref: FM58
    kind: M
    value: 0.4937681521
    unit: usd_per_hour
    display: 4
    source: >-
      CUR `split_line_item_unused_cost` summed over the resting hour's 134 split-cost child rows,
      2026-09-04 18:00-19:00Z. EKS splits each instance across the pods that ran on it by
      resource-request ratio and emits the remainder as `unused`, so this is capacity no pod asked
      for. It is not measured idleness: a pod requesting 3 cores and using 0.2 counts as requested
      in full, which makes this a lower bound on what the right-size can recover. Its complement,
      `split_line_item_split_cost` 0.3360318816, completes the node cost exactly
    group: utilisation
    appears_in: [executions/00-baseline/index.md]

  node_cost_requested:
