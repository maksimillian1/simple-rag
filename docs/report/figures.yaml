    unit: usd_per_month
    group: b_fixed

  serving_nodes:
    formula: serving_spot_pair_hour * hours_per_month
    unit: usd_per_month
    group: b_fixed

  serving_root_ebs:
    formula: 2 * 15 * gp3_gb_month
    unit: usd_per_month
    group: b_fixed

  serving_total:
    formula: serving_nodes + serving_root_ebs
    unit: usd_per_month
    group: b_fixed
