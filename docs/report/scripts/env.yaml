# How to reach the system. Addresses and access only.
#
# Not frozen with any Plan and not cited by one: this file names where things
# are, never what is under test. It differs per cluster and per operator, and a
# point is reproducible without it as long as the commit and the freeze hold.
#
# Anything that answers "what must not move" or "what closes the window" belongs
# in the runner's constant block, not here.

namespace: rag-jobs

namespaces:
  chunker: rag-jobs
  indexer: rag-jobs
  tei-embeddings: rag-platform
  api: rag-api

prometheus:
  url: http://localhost:9090
  service: svc/monitoring-kube-prometheus-prometheus
  namespace: monitoring
  mapping: "9090:9090"

qdrant:
  url: http://localhost:6333
  service: svc/qdrant
  namespace: rag-platform
  mapping: "6333:6333"
  collection: simple-rag

sqs:
  stage-1: https://sqs.eu-central-1.amazonaws.com/790348267926/simple-rag-stage-1-parsing
  stage-2: https://sqs.eu-central-1.amazonaws.com/790348267926/simple-rag-stage-2-indexing

api:
  base_url: http://localhost:8080
  service: svc/api
  namespace: rag-api
  mapping: "8080:80"

nodepool_ingestion: karpenter.sh/nodepool=apps-compute
nodepool_serving: karpenter.sh/nodepool=apps-serving

poll_seconds: 15
max_wait_seconds: 5400
