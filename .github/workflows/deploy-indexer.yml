name: Build and Push Indexer to GHCR

on:
  push:
    branches:
      - master
      - SR-system-configuration-for-report
    paths:
      - 'apps/indexer/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/indexer" >> $GITHUB_ENV

      - name: Build and Push Indexer
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -t $IMAGE_NAME:sha-${{ github.sha }} --push ./apps/indexer
