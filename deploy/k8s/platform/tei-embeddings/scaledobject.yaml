apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: tei-embeddings-scaler
  namespace: rag-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tei-embeddings
  minReplicaCount: 2
  maxReplicaCount: 30
  cooldownPeriod: 300
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 40
              periodSeconds: 30
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
      metricName: tei_cpu_usage
      metricType: AverageValue
      # sum(), not avg(): AverageValue target divides the raw metric value by
      # threshold with no replica-count factor, so avg() per-pod CPU pinned
      # desiredReplicas at ~1 regardless of total load. sum() gives total
      # demand, which is what the AverageValue formula expects.
      #
      # [2m], not [5m]: a 5m rate window takes a full 5 minutes to decay to
      # zero after load actually stops, independent of any HPA scaleDown
      # setting below — the metric itself hides the drop that long. [2m]
      # still smooths single-poll noise from SQS-batch gaps, just faster.
      query: sum(rate(container_cpu_usage_seconds_total{namespace="rag-platform", pod=~"tei-embeddings-.*", container="tei-embeddings"}[2m])) or vector(0)
      threshold: "1.5"
