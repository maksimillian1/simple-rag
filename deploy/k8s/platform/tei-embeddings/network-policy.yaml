apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: tei-netpol
spec:
  endpointSelector:
    matchLabels:
      app: tei-embeddings
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: api
        k8s:io.kubernetes.pod.namespace: rag-api
    - matchLabels:
        app: indexer
        k8s:io.kubernetes.pod.namespace: rag-jobs
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  # Prometheus scrapes /metrics on the same port the embedding API serves —
  # without this, M15/M16 (te_queue_size, te_request_inference_duration)
  # never land: Cilium drops the scrape silently (context deadline exceeded,
  # not connection refused), no error visible from the Prometheus side alone.
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
        k8s:io.kubernetes.pod.namespace: monitoring
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
