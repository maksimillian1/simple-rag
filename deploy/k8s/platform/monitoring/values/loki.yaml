loki:
  nodeSelector:
    tier: core-on-demand
  resources:
    requests:
      cpu: "200m"
      memory: "1Gi"
    limits:
      cpu: "500m"
      memory: "2Gi"
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi

promtail:
  config:
    clients:
      - url: http://monitoring-loki:3100/loki/api/v1/push
    pipelineStages:
      - match:
          selector: '{namespace="default"}'
          stages:
            - json:
                expressions:
                  duration_ms: duration_ms
                  processed_docs: processed_docs
                  status: status
                  app_name: app
            - metrics:
                rag_processing_duration_ms:
                  type: Histogram
                  description: "Processing duration derived from application logs"
                  source: duration_ms
                  config:
                    buckets: [50, 100, 250, 500, 1000, 2500, 5000, 10000]
                rag_processed_documents_total:
                  type: Counter
                  description: "Total documents processed derived from application logs"
                  source: processed_docs
                  config:
                    action: inc
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "100m"
      memory: "256Mi"
  tolerations:
    - operator: Exists
      effect: NoSchedule
    - operator: Exists
      effect: NoExecute
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: eks.amazonaws.com/compute-type
                operator: NotIn
                values:
                  - fargate
