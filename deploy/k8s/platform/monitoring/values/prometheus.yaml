kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: "7GiB"
    nodeSelector:
      tier: core-on-demand
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "1200m"
        memory: "5Gi"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    additionalScrapeConfigs:
      - job_name: 'keda-operator'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['keda']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: keda-operator
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: '8080'

      - job_name: 'cilium-ebpf-metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['kube-system']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            action: keep
            regex: cilium
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: '9962'
      - job_name: 'tei-embeddings'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [ 'rag-platform' ]
        relabel_configs:
          - source_labels: [ __meta_kubernetes_pod_label_app ]
            action: keep
            regex: tei-embeddings
          - source_labels: [ __meta_kubernetes_pod_container_port_number ]
            action: keep
            regex: '8080'
          - source_labels: [ __meta_kubernetes_pod_name ]
            target_label: pod
          - source_labels: [ __meta_kubernetes_namespace ]
            target_label: namespace

      - job_name: 'qdrant'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [ 'rag-platform' ]
        relabel_configs:
          - source_labels: [ __meta_kubernetes_pod_label_app_kubernetes_io_name ]
            action: keep
            regex: qdrant
          - source_labels: [ __meta_kubernetes_pod_container_port_number ]
            action: keep
            regex: '6333'
          - source_labels: [ __meta_kubernetes_pod_name ]
            target_label: pod
          - source_labels: [ __meta_kubernetes_namespace ]
            target_label: namespace

grafana:
  nodeSelector:
    tier: core-on-demand
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "200m"
      memory: "512Mi"
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/monitor/"
      serve_from_sub_path: true
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://monitoring-loki.monitoring.svc.cluster.local:3100
      jsonData:
        maxLines: 1000

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      tier: core-on-demand
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"

kube-state-metrics:
  metricLabelsAllowlist:
    - "nodes=[karpenter.sh/nodepool,karpenter.sh/capacity-type]"
  nodeSelector:
    tier: core-on-demand
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "100m"
      memory: "256Mi"

prometheusOperator:
  nodeSelector:
    tier: core-on-demand
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  admissionWebhooks:
    namespace: monitoring
    patch:
      nodeSelector:
        tier: core-on-demand

prometheus-node-exporter:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: eks.amazonaws.com/compute-type
                operator: NotIn
                values:
                  - fargate
