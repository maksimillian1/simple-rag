# EC2NodeClass for the apps-serving pool. Split from apps-compute so each
# NodePool's instances carry a distinct `tier` AWS tag for cost attribution
# (spec.tags is per-EC2NodeClass, not per-NodePool).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: apps-serving
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  amiFamily: AL2023
  role: "{{ .Values.clusterName }}-karpenter-node"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "{{ .Values.clusterName }}"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "{{ .Values.clusterName }}"
  amiSelectorTerms:
    - alias: al2023@latest
  tags:
    feature: simple-rag
    tier: apps-serving
---
# EC2NodeClass for the apps-compute pool. See apps-serving above for why
# this is not shared.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: apps-compute
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  amiFamily: AL2023
  role: "{{ .Values.clusterName }}-karpenter-node"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "{{ .Values.clusterName }}"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "{{ .Values.clusterName }}"
  amiSelectorTerms:
    - alias: al2023@latest
  tags:
    feature: simple-rag
    tier: apps-compute
---
# Tier 3: apps-serving Pool (Mixed Spot/On-Demand)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: apps-serving
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    metadata:
      labels:
        tier: apps-serving
        feature: simple-rag
    spec:
      expireAfter: 720h
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r", "t"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: apps-serving
      taints:
        - key: role
          value: serving
          effect: NoSchedule
  limits:
    cpu: 100
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    # 1m was shorter than EC2 launch + kubelet + Cilium boot time (~1-2m),
    # so Karpenter's own disruption controller was deleting a freshly
    # provisioned node as "Empty" before the pod Karpenter had just
    # nominated to it could actually bind — endless nodeclaim replace loop.
    consolidateAfter: 5m
---
# Tier 4: apps-compute Pool (Strict Spot Scale-to-Zero)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: apps-compute
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    metadata:
      labels:
        tier: apps-compute
        feature: simple-rag
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        # Pinned to one family (compute-optimized Graviton, gen 7) rather than
        # the previous open category/arch range — both chunker and indexer are
        # single-threaded and CPU-bound, so c/m/r variety and amd64 bought
        # nothing but unpredictable per-node pricing and churn. Multiple sizes
        # are still allowed so Karpenter has somewhere to fall back to if one
        # size's Spot pool is briefly out of capacity.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c7g"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge", "2xlarge", "4xlarge"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: apps-compute
      taints:
        - key: role
          value: compute
          effect: NoSchedule
  limits:
    cpu: 200
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
