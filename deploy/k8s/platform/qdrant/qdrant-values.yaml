replicaCount: 2

config:
  cluster:
    enabled: true

resources:
  limits:
    cpu: "2"
    memory: 6Gi
  requests:
    cpu: "1"
    memory: 4Gi

# ADR-0016: Strict Node Boundaries
nodeSelector:
  tier: database

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "database"
    effect: "NoSchedule"

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/instance: qdrant

persistence:
  storageClassName: "gp3"
  size: 50Gi

# IAM mapping is handled via AWS EKS Pod Identity Association in Terraform
serviceAccount:
  create: true
  name: "qdrant-backup-sa"

extraVolumes:
  - name: shared-snapshots
    emptyDir: {}

extraVolumeMounts:
  - name: shared-snapshots
    mountPath: /snapshots

# Zero-Touch Bootstrap Recovery
extraInitContainers:
  - name: auto-restore
    image: amazon/aws-cli:2.15.0
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -d "/qdrant/storage/collections/simple-rag" ]; then
          echo "Empty PV detected. Attempting to fetch latest snapshot from S3..."
          LATEST=$(aws s3 ls s3://${S3_BACKUP_BUCKET}/snapshots/simple-rag/ | sort | tail -n 1 | awk '{print $4}')
          if [ -n "$LATEST" ]; then
            aws s3 cp s3://${S3_BACKUP_BUCKET}/snapshots/simple-rag/${LATEST} /snapshots/simple-rag.snapshot
            echo "Snapshot ${LATEST} staged for Qdrant auto-restore."
          else
            echo "No snapshots found in S3. Starting empty cluster."
            touch /snapshots/simple-rag.snapshot
          fi
        else
          echo "PV already contains data. Skipping restore."
          touch /snapshots/simple-rag.snapshot
        fi
    env:
      - name: S3_BACKUP_BUCKET
        valueFrom:
          configMapKeyRef:
            name: qdrant-infra-config
            key: QDRANT_BACKUP_BUCKET_NAME
    volumeMounts:
      - name: shared-snapshots
        mountPath: /snapshots
      - name: storage
        mountPath: /qdrant/storage

extraArgs:
  - --snapshot
  - /snapshots/simple-rag.snapshot
