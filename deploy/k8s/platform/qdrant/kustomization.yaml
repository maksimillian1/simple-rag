apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rag-platform

resources:
  - qdrant-backup-cronjob.yaml
  - service-account.yaml
  - collection-init-job.yaml

helmCharts:
  - name: qdrant
    repo: https://qdrant.github.io/qdrant-helm
    releaseName: qdrant
    version: 1.18.2
    valuesFile: qdrant-values.yaml

components:
  - component

patches:
  - target:
      kind: StatefulSet
      name: qdrant
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: qdrant
      spec:
        template:
          spec:
            serviceAccountName: qdrant-backup-sa
            initContainers:
              - name: auto-restore
                image: amazon/aws-cli:2.15.0
                command:
                  - /bin/sh
                  - -c
                  - |
                    if [ ! -d "/qdrant/storage/collections/simple-rag" ]; then
                      echo "Empty PV detected. Attempting to fetch latest snapshot from S3..."
                      LATEST=$(aws s3 ls s3://${S3_BACKUP_BUCKET}/snapshots/simple-rag/ | sort | tail -n 1 | awk '{print $4}')
                      if [ -n "$LATEST" ]; then
                        aws s3 cp s3://${S3_BACKUP_BUCKET}/snapshots/simple-rag/${LATEST} /qdrant/snapshots/simple-rag.snapshot
                        echo "Snapshot ${LATEST} staged for Qdrant auto-restore."
                      else
                        echo "No snapshots found in S3. Starting empty cluster."
                        touch /qdrant/snapshots/simple-rag.snapshot
                      fi
                    else
                      echo "PV already contains data. Skipping restore."
                      touch /qdrant/snapshots/simple-rag.snapshot
                    fi
                env:
                  - name: S3_BACKUP_BUCKET
                    valueFrom:
                      configMapKeyRef:
                        name: qdrant-infra-config
                        key: QDRANT_BACKUP_BUCKET_NAME
                volumeMounts:
                  - name: qdrant-snapshots
                    mountPath: /qdrant/snapshots
                  - name: qdrant-storage
                    mountPath: /qdrant/storage
