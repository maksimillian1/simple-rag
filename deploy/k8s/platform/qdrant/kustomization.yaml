apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rag-platform

resources:
  - qdrant-backup-cronjob.yaml
  - service-account.yaml

helmCharts:
  - name: qdrant
    repo: https://qdrant.github.io/qdrant-helm
    releaseName: qdrant
    version: 1.18.2
    valuesFile: qdrant-values.yaml

components:
  - component

