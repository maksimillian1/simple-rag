apiVersion: batch/v1
kind: Job
metadata:
  name: qdrant-restore-collection
  namespace: rag-platform
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      serviceAccountName: qdrant-backup-sa
      nodeSelector:
        tier: database
      tolerations:
        - key: dedicated
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
        - name: restore-collection
          image: amazon/aws-cli:2.15.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Qdrant to be ready..."
              until curl -s http://qdrant.rag-platform.svc.cluster.local:6333/readyz; do
                sleep 2
              done
              
              echo "Checking if simple-rag collection exists..."
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://qdrant.rag-platform.svc.cluster.local:6333/collections/simple-rag)
              
              if [ "$STATUS" -eq 200 ]; then
                echo "Collection already exists. Skipping restore."
                exit 0
              fi
              
              echo "Collection missing. Attempting to fetch latest snapshot from S3..."
              LATEST=$(aws s3 ls s3://${S3_BACKUP_BUCKET}/snapshots/simple-rag/ | sort | tail -n 1 | awk '{print $4}')
              
              if [ -n "$LATEST" ]; then
                echo "Downloading snapshot ${LATEST}..."
                aws s3 cp s3://${S3_BACKUP_BUCKET}/snapshots/simple-rag/${LATEST} /tmp/qdrant-restore.snapshot
                
                echo "Restoring snapshot to Qdrant..."
                curl -X POST 'http://qdrant.rag-platform.svc.cluster.local:6333/collections/simple-rag/snapshots/upload?priority=snapshot' \
                    -H 'Content-Type: multipart/form-data' \
                    -F 'snapshot=@/tmp/qdrant-restore.snapshot'
                
                echo "Restore complete!"
              else
                echo "No snapshots found in S3. Creating empty simple-rag collection..."
                curl -s -X PUT "http://qdrant.rag-platform.svc.cluster.local:6333/collections/simple-rag" \
                  -H 'Content-Type: application/json' \
                  -d '{
                    "vectors": {
                      "text-dense": {
                        "size": 384,
                        "distance": "Cosine"
                      }
                    },
                    "sparse_vectors": {
                      "text-sparse": {}
                    }
                  }'
                echo "Collection created!"
              fi
          env:
            - name: S3_BACKUP_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: qdrant-infra-config
                  key: QDRANT_BACKUP_BUCKET_NAME
      restartPolicy: OnFailure
