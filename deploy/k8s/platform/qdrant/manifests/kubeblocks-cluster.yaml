apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: qdrant-vector-db
  namespace: rag-platform
  labels:
    app: qdrant
spec:
  clusterDef: qdrant
  topology: cluster
  terminationPolicy: WipeOut
  componentSpecs:
    - name: qdrant
      serviceVersion: 1.8.4
      replicas: 1
      resources:
        requests:
          cpu: "1"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "6Gi"
      volumeClaimTemplates:
        - name: data
          spec:
            storageClassName: gp3
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 100Gi
      nodeSelector:
        tier: database
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "database"
          effect: "NoSchedule"
