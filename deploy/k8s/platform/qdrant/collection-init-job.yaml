apiVersion: batch/v1
kind: Job
metadata:
  name: qdrant-create-collection
  namespace: rag-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      containers:
        - name: init-collection
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Qdrant to be ready..."
              until curl -s http://qdrant.rag-platform.svc.cluster.local:6333/readyz; do
                sleep 2
              done
              
              echo "Creating simple-rag collection (idempotent)..."
              curl -s -X PUT "http://qdrant.rag-platform.svc.cluster.local:6333/collections/simple-rag" \
                -H 'Content-Type: application/json' \
                -d '{
                  "vectors": {
                    "size": 384,
                    "distance": "Cosine"
                  },
                  "sparse_vectors": {
                    "sparse": {}
                  }
                }'
      restartPolicy: OnFailure
