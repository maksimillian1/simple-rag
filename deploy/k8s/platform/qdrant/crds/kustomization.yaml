apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/apecloud/kubeblocks/releases/download/v1.0.2/kubeblocks_crds.yaml
patches:
  - target:
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: .*
        annotations:
          argocd.argoproj.io/sync-wave: "-10"
