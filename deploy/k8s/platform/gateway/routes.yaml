apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: rag-api
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: rag-platform
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: simple-rag-api
          port: 8080
