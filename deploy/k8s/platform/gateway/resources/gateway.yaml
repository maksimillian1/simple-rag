apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gateway
  namespace: rag-platform
spec:
  gatewayClassName: aws-nlb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: nlb-config
  listeners:
    - name: tcp
      protocol: TCP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
