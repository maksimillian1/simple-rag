apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: chunker
spec:
  jobTargetRef:
    template:
      metadata:
        labels:
          app: chunker
      spec:
        serviceAccountName: chunker-sa
        terminationGracePeriodSeconds: 120
        nodeSelector:
          karpenter.sh/nodepool: apps-compute
        tolerations:
        - key: "karpenter.sh/capacity-type"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
        - key: "role"
          operator: "Equal"
          value: "compute"
          effect: "NoSchedule"
        containers:
        - name: chunker
          image: ghcr.io/maksimillian1/simple-rag/chunker:latest
          env:
          - name: AWS_SQS_STAGE_1_URL
            valueFrom:
              configMapKeyRef:
                name: sqs-config
                key: AWS_SQS_STAGE_1_URL
          - name: AWS_SQS_STAGE_2_URL
            valueFrom:
              configMapKeyRef:
                name: sqs-config
                key: AWS_SQS_STAGE_2_URL
          resources:
            requests:
              cpu: 100m # measured p90 86m, max 247m over a 100-file run (01-ingestion/ingestion-n50-test) — PyMuPDF extraction is single-threaded, never got near the old 500m
              memory: 512Mi
            limits:
              cpu: 500m # 2x the observed max (247m); single-threaded, more would go unused
              memory: 1Gi # ~2.3x observed max (433Mi) against a 78.8 MB sample file. Corpus has PDFs up to 124 MB, untested here — image-heavy ones can decode to several times file size, so this has less margin on the untested tail than the CPU row
        restartPolicy: Never
  pollingInterval: 15
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  maxReplicaCount: 50
  triggers:
  - type: aws-sqs-queue
    metadata:
      queueURLFromEnv: AWS_SQS_STAGE_1_URL
      awsRegion: "eu-central-1"
      queueLength: "5"
      identityOwner: operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chunker-sa
