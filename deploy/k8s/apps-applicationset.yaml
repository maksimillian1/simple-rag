apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rag-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/maksimillian1/simple-rag.git
        revision: SR-system-configuration-for-report
        directories:
          - path: deploy/k8s/platform/*
          - path: deploy/k8s/apps/*
  template:
    metadata:
      name: '{{path.basename}}'
      # Controller namespace
      namespace: argocd
      annotations:
        # Dynamic alias 'img-{{path.basename}}' for each app separately
        argocd-image-updater.argoproj.io/image-list: img-{{path.basename}}=ghcr.io/maksimillian1/simple-rag/{{path.basename}}
        argocd-image-updater.argoproj.io/img-{{path.basename}}.update-strategy: latest
        argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-repository-creds
        argocd-image-updater.argoproj.io/git-branch: SR-system-configuration-for-report
        # syncOptions below turns on ServerSideApply, but compare (OutOfSync)
        # still defaulted to client-side diffing against
        # kubectl.kubernetes.io/last-applied-configuration — an annotation
        # SSA never writes. Resources with immutable/defaulted fields it's
        # touchy about (StatefulSet volumeClaimTemplates, in qdrant's case)
        # never settle: every reconcile "finds" a diff, syncs, then
        # immediately re-flags OutOfSync. Comparing server-side too closes
        # that gap.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: default
      source:
        repoURL: https://github.com/maksimillian1/simple-rag.git
        targetRevision: SR-system-configuration-for-report
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      ignoreDifferences:
        # Deployments here (api, tei-embeddings) are scaled by a KEDA-managed
        # HPA. Without this, ArgoCD's selfHeal treats every HPA-driven scale
        # as drift from the manifest's replicas value
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 15
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
