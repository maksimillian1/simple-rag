apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rag-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/maksimillian1/simple-rag.git
        revision: SR-system-configuration-for-report
        directories:
          - path: deploy/k8s/platform/*
          - path: deploy/k8s/apps/*
  template:
    metadata:
      name: '{{path.basename}}'
      # Controller namespace
      namespace: argocd
      annotations:
        # Dynamic alias 'img-{{path.basename}}' for each app separately
        argocd-image-updater.argoproj.io/image-list: img-{{path.basename}}=ghcr.io/maksimillian1/simple-rag/{{path.basename}}
        argocd-image-updater.argoproj.io/img-{{path.basename}}.update-strategy: latest
        argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-repository-creds
        argocd-image-updater.argoproj.io/git-branch: SR-system-configuration-for-report
        # Tried argocd.argoproj.io/compare-options: ServerSideDiff=true here to
        # fix qdrant's self-heal loop (StatefulSet volumeClaimTemplates never
        # settling under client-side diff + ServerSideApply). Reverted: this
        # gitops-engine version (v0.7.1) panics computing ServerSideDiff on at
        # least some apps ("Recovered from panic: invalid memory address or
        # nil pointer dereference" in diff.removeWebhookMutation, observed on
        # `api`) — the panic is caught per-app, but that app's reconcile that
        # cycle is silently incomplete, which is worse than the qdrant loop it
        # was meant to fix (it was blocking indexer/chunker from ever picking
        # up new commits, not just qdrant staying noisy). Qdrant loop is
        # cosmetic (confirmed: doesn't touch pods, no cost) — left unfixed
        # rather than risk this again.
    spec:
      project: default
      source:
        repoURL: https://github.com/maksimillian1/simple-rag.git
        targetRevision: SR-system-configuration-for-report
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      ignoreDifferences:
        # Deployments here (api, tei-embeddings) are scaled by a KEDA-managed
        # HPA. Without this, ArgoCD's selfHeal treats every HPA-driven scale
        # as drift from the manifest's replicas value
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 15
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
